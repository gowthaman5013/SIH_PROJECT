server.port=${PORT:8088}

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:victimcare_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# External ML Services Config
text.ml.service.url=http://localhost:8001
voice.ml.service.url=http://localhost:8002

# Sarvam STT Config (loaded dynamically from environment/.env)
sarvam.api.key=${SARVAM_API_KEY:your_key_here}
